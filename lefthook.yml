# Gates locais: pre-commit só nos arquivos em stage (< 10 s) e pre-push só com o typecheck
# incremental (tsbuildinfo por pacote). Testes ligados ao diff: `pnpm test:related`, antes de
# abrir o PR. Suíte completa, testes com D1 (vitest-plugin), prova de migrations no D1
# efêmero e build OpenNext ficam no CI.

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: pnpm exec eslint --cache --cache-location node_modules/.cache/eslint/ --max-warnings=0 --no-warn-ignored {staged_files}
    - name: lint-migrations
      # Expand/contract e imutabilidade (AGENTS.md §Migrations).
      glob: "packages/db/migrations/*.sql"
      run: node scripts/lint-migrations.mjs {staged_files}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
