name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrations:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:quality
      - run: pnpm build

  migrate:
    needs: quality
    runs-on: ubuntu-latest
    # Existe um único banco (o Supabase de produção, sem staging/local — ver
    # decisões/55). Duas runs em paralelo (ex.: push em master + PR) escrevem
    # e apagam fixtures sintéticas no mesmo banco ao mesmo tempo, produzindo
    # falso positivo de resíduo em verify-production-state.mjs. O grupo é uma
    # string fixa (não usa github.ref) para valer entre branches diferentes,
    # e é o mesmo em `migrate` e `integration` para serializar qualquer job
    # que toque o banco, de qualquer run. `quality` não entra: não toca banco.
    # cancel-in-progress: false — cancelar no meio deixaria fixtures órfãs.
    concurrency:
      group: supabase-producao-migrations
      cancel-in-progress: false
      # Sem `queue: max` o GitHub guarda só UM job pendente por grupo: um
      # terceiro pedido cancela o que estava na fila. Isso poderia cancelar um
      # `integration` já enfileirado depois de o `migrate` correspondente ter
      # aplicado a migration em produção — banco alterado, prova não executada.
      queue: max
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar migrations no Foode Delivery
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          # Identificador único desta run, usado para marcar as fixtures
          # sintéticas (ver preflight-production-migrations.ts) e permitir
          # que a checagem de resíduo seja escopada só a elas.
          CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_POOLER_URL"
          pnpm db:migrations:validate
          pnpm run build:packages
          pnpm --filter @foode/api migrations:preflight
          pnpm --filter @foode/db migrations:sync-supabase
          pnpm supabase link --project-ref emdbvwylytduvuzvavgy --password "$SUPABASE_DB_PASSWORD"
          pnpm supabase db push --linked --dry-run
          pnpm supabase db push --linked
          pnpm supabase migration list --linked

  integration:
    needs: migrate
    runs-on: ubuntu-latest
    # Mesmo grupo do job `migrate`: é o par que toca o banco de produção
    # nesta run (fixtures de RLS/RBAC + verificação de resíduo).
    concurrency:
      group: supabase-producao-migrations
      cancel-in-progress: false
      # Sem `queue: max` o GitHub guarda só UM job pendente por grupo: um
      # terceiro pedido cancela o que estava na fila. Isso poderia cancelar um
      # `integration` já enfileirado depois de o `migrate` correspondente ter
      # aplicado a migration em produção — banco alterado, prova não executada.
      queue: max
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provar HTTP, RLS e RBAC no Supabase de produção
        env:
          BUSINESS_DATABASE_URL: ${{ secrets.BUSINESS_DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          # Mesma identidade usada pelo job `migrate`: escopa as fixtures
          # desta run e a checagem de resíduo (verify-production-state.mjs).
          CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -n "$BUSINESS_DATABASE_URL"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_POOLER_URL"
          set +e
          pnpm test
          test_status=$?
          pnpm db:production:verify
          verify_status=$?
          set -e
          test "$test_status" -eq 0
          test "$verify_status" -eq 0
