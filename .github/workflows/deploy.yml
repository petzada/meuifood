name: Deploy (Cloudflare Workers)
# Push na master (e workflow_dispatch, que o db-migrate dispara ao terminar): publica os
# três Workers em produção (api → web → admin: web e admin têm service binding para a api)
# com os secrets sincronizados do GitHub, e roda o smoke.
#
# Se houver migration ainda não aplicada no D1 de produção, o deploy é ADIADO (job
# verde, aviso no resumo): rode o workflow db-migrate (confirmar=aplicar), que aplica e
# dispara este deploy. Assim o código novo nunca sobe antes do schema (expand/contract).
#
# Domínios (Ticket 25, `routes` com `custom_domain` nos wrangler.jsonc; o deploy cria DNS e
# certificado): foodedelivery.com.br (web), admin.foodedelivery.com.br (admin) e
# api.foodedelivery.com.br (api); www → apex por Redirect Rule da zona. Smoke nos domínios
# (SMOKE_*_URL sobrescreve) e, depois, no workers.dev da conta (fallback, ainda ligado).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez; o seguinte espera (não interrompe um deploy no meio).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  migrations-pendentes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.listar.outputs.pending }}
    steps:
      - name: Só a partir da master
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::produção só é publicada a partir da master (ref: $GITHUB_REF)"; exit 1
          fi
          : "${CLOUDFLARE_API_TOKEN:?secret CLOUDFLARE_API_TOKEN ausente}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID ausente}"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations pendentes no D1 de produção
        id: listar
        working-directory: apps/api
        run: |
          out=$(pnpm exec wrangler d1 migrations list foode-prod --remote 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if grep -q "No migrations to apply" <<< "$out"; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy adiado"
              echo "Há migration pendente no D1 de produção. Rode **DB Migrate (produção)** com \`confirmar=aplicar\`;"
              echo "ele aplica as migrations e dispara este deploy."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::deploy adiado: migration pendente (rode db-migrate)"
          fi

  deploy:
    needs: migrations-pendentes
    if: needs.migrations-pendentes.outputs.pending == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/admin/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build:packages
      # Site key pública do Turnstile (GitHub variable) para o widget do Painel (login, reset,
      # definir senha, convite); o nome que o admin lê é definido na fatia UI do Ticket 22.
      - name: Build OpenNext (web e admin)
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: pnpm --filter @foode/web --filter @foode/admin build:cf
      - name: Tamanho dos Workers (teto 10 MiB gzip)
        run: node scripts/worker-size.mjs apps/api apps/web apps/admin
      # Secrets do GitHub → arquivo temporário (0600) por Worker, enviado junto com a
      # versão (`wrangler deploy --secrets-file`). Valor vazio é omitido (ex.: Sentry sem
      # DSN ainda): o Worker segue sem ele. Nada é impresso no log.
      - name: Arquivos de secrets
        env:
          SENTRY_DSN_API: ${{ secrets.SENTRY_DSN_API }}
          SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
          SENTRY_DSN_ADMIN: ${{ secrets.SENTRY_DSN_ADMIN }}
          MILLIONSEND_API_KEY: ${{ secrets.MILLIONSEND_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ORDER_TOKEN_SECRET: ${{ secrets.ORDER_TOKEN_SECRET }}
          PHONE_LOOKUP_IP_SALT: ${{ secrets.PHONE_LOOKUP_IP_SALT }}
          WHATSMIAU_API_KEY: ${{ secrets.WHATSMIAU_API_KEY }}
          WHATSMIAU_INSTANCE_ID: ${{ secrets.WHATSMIAU_INSTANCE_ID }}
          ABACATEPAY_API_KEY: ${{ secrets.ABACATEPAY_API_KEY }}
          ABACATEPAY_WEBHOOK_SECRET: ${{ secrets.ABACATEPAY_WEBHOOK_SECRET }}
          ABACATEPAY_SIGNING_KEY: ${{ secrets.ABACATEPAY_SIGNING_KEY }}
          SALES_WHATSAPP: ${{ secrets.SALES_WHATSAPP }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/secrets"
          mkdir -p "$dir"
          # Auth (Ticket 22) não sobe sem o segredo do Better Auth: sem ele a api recusa login.
          : "${BETTER_AUTH_SECRET:?secret BETTER_AUTH_SECRET ausente}"
          : "${TURNSTILE_SECRET_KEY:?secret TURNSTILE_SECRET_KEY ausente}"
          # Pedido (Ticket 24a): token da página do Pedido e sal do IP da busca por telefone.
          # Sem eles a criação do Pedido e a busca falham fechadas; trocar o token invalida links.
          : "${ORDER_TOKEN_SECRET:?secret ORDER_TOKEN_SECRET ausente}"
          : "${PHONE_LOOKUP_IP_SALT:?secret PHONE_LOOKUP_IP_SALT ausente}"
          # Login do Consumidor (Ticket 13, decisão 65): whatsmiau OPCIONAL. Vazio = omitido e o
          # login responde "indisponível no momento" (o Dono conecta o número no fim).
          # PIX AbacatePay (Ticket 26): chaves OPCIONAIS. Sem as três, PIX fica fora do checkout.
          jq -n '{SENTRY_DSN: env.SENTRY_DSN_API, MILLIONSEND_API_KEY: env.MILLIONSEND_API_KEY,
                  BETTER_AUTH_SECRET: env.BETTER_AUTH_SECRET, TURNSTILE_SECRET_KEY: env.TURNSTILE_SECRET_KEY,
                  ORDER_TOKEN_SECRET: env.ORDER_TOKEN_SECRET, PHONE_LOOKUP_IP_SALT: env.PHONE_LOOKUP_IP_SALT,
                  WHATSMIAU_API_KEY: env.WHATSMIAU_API_KEY, WHATSMIAU_INSTANCE_ID: env.WHATSMIAU_INSTANCE_ID,
                  ABACATEPAY_API_KEY: env.ABACATEPAY_API_KEY, ABACATEPAY_WEBHOOK_SECRET: env.ABACATEPAY_WEBHOOK_SECRET,
                  ABACATEPAY_SIGNING_KEY: env.ABACATEPAY_SIGNING_KEY}
            | with_entries(select(.value != null and .value != ""))' > "$dir/api.json"
          # Ticket 31 (decisão 70): WhatsApp de vendas só no Worker do web (`/falar` redireciona no
          # servidor). OPCIONAL: sem ele, `/falar` leva ao formulário de contato da landing.
          jq -n '{SENTRY_DSN: env.SENTRY_DSN_WEB, SALES_WHATSAPP: env.SALES_WHATSAPP} | with_entries(select(.value != null and .value != ""))' > "$dir/web.json"
          jq -n '{SENTRY_DSN: env.SENTRY_DSN_ADMIN} | with_entries(select(.value != null and .value != ""))' > "$dir/admin.json"
          for worker in api web admin; do
            echo "$worker: $(jq -r 'keys | join(", ") | if . == "" then "(nenhum)" else . end' "$dir/$worker.json")"
          done
          echo "SECRETS_DIR=$dir" >> "$GITHUB_ENV"
      # Vars de Auth: GitHub variables sobrescrevem o padrão do wrangler.jsonc quando definidas.
      - name: Deploy api
        working-directory: apps/api
        env:
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          WHATSMIAU_API_URL: ${{ vars.WHATSMIAU_API_URL }}
        run: |
          args=(--secrets-file "$SECRETS_DIR/api.json")
          if [ -n "$BETTER_AUTH_URL" ]; then args+=(--var "BETTER_AUTH_URL:$BETTER_AUTH_URL"); fi
          if [ -n "$EMAIL_FROM" ]; then args+=(--var "EMAIL_FROM:$EMAIL_FROM"); fi
          if [ -n "$WHATSMIAU_API_URL" ]; then args+=(--var "WHATSMIAU_API_URL:$WHATSMIAU_API_URL"); fi
          pnpm exec wrangler deploy "${args[@]}"
      - name: Deploy web
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare deploy --secrets-file "$SECRETS_DIR/web.json"
      - name: Deploy admin
        working-directory: apps/admin
        run: pnpm exec opennextjs-cloudflare deploy --secrets-file "$SECRETS_DIR/admin.json"
      - name: Apagar arquivos de secrets
        if: always()
        run: rm -rf "$RUNNER_TEMP/secrets"
      # Domínio novo: o certificado do custom domain pode levar alguns minutos no 1º deploy,
      # por isso mais tentativas (24 × 10 s).
      - name: Smoke nos domínios (/health, Storefront, /privacidade, login do Painel, /ops, bindings)
        env:
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL || 'https://api.foodedelivery.com.br' }}
          SMOKE_WEB_URL: ${{ vars.SMOKE_WEB_URL || 'https://foodedelivery.com.br' }}
          SMOKE_ADMIN_URL: ${{ vars.SMOKE_ADMIN_URL || 'https://admin.foodedelivery.com.br' }}
          SMOKE_ATTEMPTS: 24
          SMOKE_DELAY_MS: 10000
        run: node scripts/smoke.mjs
      - name: Smoke no workers.dev (fallback)
        run: node scripts/smoke.mjs
