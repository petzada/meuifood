name: DB Migrate (produção)
# Manual: aplica as migrations pendentes (packages/db/migrations) no D1 de produção
# `foode-prod`, roda o seed idempotente dos usuários foode_ops (FOODE_OPS_EMAILS) e
# dispara o deploy. Runbook: AGENTS.md §Migrations.
#   gh workflow run db-migrate.yml -f confirmar=aplicar
# Migration contract (linha `-- contract:`) exige também -f contract=sim.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite "aplicar" para confirmar'
        required: true
      contract:
        description: 'Há migration contract pendente e o Dono confirmou? ("sim" libera)'
        required: false
        default: "nao"

permissions:
  contents: read
  actions: write

concurrency:
  group: db-migrate-producao
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_PROD_DATABASE_ID: ${{ vars.D1_PROD_DATABASE_ID }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Validar confirmação
        working-directory: .
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          [ "$CONFIRMAR" = "aplicar" ] || { echo "::error::Confirmação inválida (digite aplicar)"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/master" ] || { echo "::error::só a partir da master"; exit 1; }
          : "${CLOUDFLARE_API_TOKEN:?secret CLOUDFLARE_API_TOKEN ausente}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID ausente}"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Conferir o D1 do wrangler.jsonc
        run: |
          configured=$(node -e "const s=require('fs').readFileSync('wrangler.jsonc','utf8');const m=s.match(/\"database_id\":\s*\"([^\"]+)\"/);process.stdout.write(m?m[1]:'')")
          echo "D1 no wrangler.jsonc: $configured"
          if [ -n "$D1_PROD_DATABASE_ID" ] && [ "$configured" != "$D1_PROD_DATABASE_ID" ]; then
            echo "::error::wrangler.jsonc aponta para $configured, mas D1_PROD_DATABASE_ID é $D1_PROD_DATABASE_ID"; exit 1
          fi
      - name: Migrations pendentes (e trava de contract)
        env:
          CONTRACT: ${{ inputs.contract }}
        run: |
          out=$(pnpm exec wrangler d1 migrations list foode-prod --remote 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          pending=$(grep -oE '[0-9]{4}_[a-z0-9_]+\.sql' <<< "$out" | sort -u || true)
          contract=""
          for name in $pending; do
            if grep -qE '^\s*--\s*contract:\s*\S' "../../packages/db/migrations/$name"; then
              contract="$contract $name"
            fi
          done
          if [ -n "$contract" ] && [ "$CONTRACT" != "sim" ]; then
            echo "::error::migration contract pendente:$contract — peça confirmação ao Dono e rode com -f contract=sim"
            exit 1
          fi
      - name: Bookmark do Time Travel (ponto de restauração)
        run: pnpm exec wrangler d1 time-travel info foode-prod --json || echo "::warning::bookmark indisponível"
      - name: Aplicar migrations
        run: |
          pnpm exec wrangler d1 migrations apply foode-prod --remote
          pnpm exec wrangler d1 migrations list foode-prod --remote
      - name: Seed foode_ops (idempotente, sem senha)
        env:
          FOODE_OPS_EMAILS: ${{ vars.FOODE_OPS_EMAILS || secrets.FOODE_OPS_EMAILS }}
        run: |
          if [ -z "$FOODE_OPS_EMAILS" ]; then
            echo "::warning::FOODE_OPS_EMAILS vazio: seed foode_ops pulado"; exit 0
          fi
          umask 077
          node ../../packages/db/scripts/seed-ops-sql.mjs "$RUNNER_TEMP/seed.sql"
          pnpm exec wrangler d1 execute foode-prod --remote --file "$RUNNER_TEMP/seed.sql" > /dev/null
          rm -f "$RUNNER_TEMP/seed.sql"
          echo "seed foode_ops aplicado."
      - name: Disparar o deploy
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
